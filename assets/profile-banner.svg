<svg xmlns="http://www.w3.org/2000/svg" width="860" height="200" viewBox="0 0 860 200" role="img" aria-labelledby="banner-title banner-description">
  <title id="banner-title">Joshua Bugarin</title>
  <desc id="banner-description">Joshua Bugarin, @JMBugarin, over a coastal sunset with gently moving waves.</desc>

  <defs>
    <clipPath id="frame">
      <rect width="860" height="200" rx="14"/>
    </clipPath>
    <linearGradient id="sky" x1="28" y1="10" x2="804" y2="156" gradientUnits="userSpaceOnUse">
      <stop stop-color="#112B45"/>
      <stop offset=".56" stop-color="#28536D"/>
      <stop offset="1" stop-color="#58828C"/>
    </linearGradient>
    <linearGradient id="water" x1="420" y1="110" x2="420" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2C647B"/>
      <stop offset="1" stop-color="#102F48"/>
    </linearGradient>
    <radialGradient id="glow" cx="702" cy="60" r="118" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7CA9B" stop-opacity=".36"/>
      <stop offset="1" stop-color="#F7CA9B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sun" x1="702" y1="34" x2="702" y2="86" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFE2B8"/>
      <stop offset="1" stop-color="#F6BD9B"/>
    </linearGradient>
    <style>
      @media (prefers-reduced-motion: no-preference) {
        .far-wave { animation: drift 10s ease-in-out infinite alternate; }
        .near-wave { animation: drift 14s ease-in-out infinite alternate-reverse; }
      }
      @keyframes drift {
        from { transform: translate(-8px, 0); }
        to { transform: translate(8px, 2px); }
      }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="860" height="200" fill="url(#sky)"/>
    <circle cx="702" cy="60" r="118" fill="url(#glow)"/>
    <circle cx="702" cy="60" r="26" fill="url(#sun)"/>

    <g fill="none" stroke="#C5E0E6" stroke-width="1.5" stroke-linecap="round" opacity=".34">
      <path d="M87 45h35m7 0h12m-75 8h22m69-20h23"/>
      <path d="M745 69h41m9 0h15m-44 8h29"/>
    </g>

    <path d="M0 95c32-2 54 10 79 11 25 1 39-6 64-4 26 2 37 9 77 13H0Z" fill="#244A5D"/>
    <path d="M747 114c27-2 35-14 55-14 26 0 36-17 58-20v38Z" fill="#365D69"/>
    <path d="M0 113c153 2 257 3 419-1 159-4 264 1 441-2v90H0Z" fill="url(#water)"/>

    <g class="far-wave">
      <path d="M-24 139c115 1 174-14 279-14 127 0 195 13 313 11 108-2 206-14 316-8v79H-24Z" fill="#66A6B2" opacity=".22"/>
      <path d="M35 143c40 2 66 1 109-3m503-9c44-4 81-6 120-4m-101 10c33-3 66-3 91-3" fill="none" stroke="#F2D4AA" stroke-width="1.2" stroke-linecap="round" opacity=".34"/>
    </g>
    <g class="near-wave">
      <path d="M-24 163c125-14 234 9 370 7 154-3 258-23 375-18 67 3 110 13 163 10v45H-24Z" fill="#102E47" opacity=".52"/>
      <path d="M0 164c128-10 214 8 347 7 154-1 254-22 374-17 53 2 94 10 139 9" fill="none" stroke="#91C8CE" stroke-width="1.15" opacity=".36"/>
      <path d="M38 183c76-4 144 4 207 6m353-12c76-7 138-5 203 4" fill="none" stroke="#82B7C3" stroke-width="1.15" stroke-linecap="round" opacity=".22"/>
    </g>

    <g text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
      <text x="430" y="101" fill="#F7FCFF" font-size="59" font-weight="800" letter-spacing="-2">Joshua Bugarin</text>
      <text x="430" y="130" fill="#DBF1F5" font-size="19" font-weight="600" letter-spacing="1">@JMBugarin</text>
    </g>
  </g>
  <rect x=".5" y=".5" width="859" height="199" rx="13.5" fill="none" stroke="#AACBD5" stroke-opacity=".36"/>
</svg>
